server:
  port: 8080

app:
  name: Todo App
  version: 1.0.0
  api-version: 2.0.0
  upload:
    dir: uploads
    max-size: 10485760

spring:
  application:
    name: todo-app
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    com.mipt.todo: INFO
