logging:
  level:
    com.mipt.todo: DEBUG
    org.springframework: DEBUG

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/todo_dev}
    username: ${DB_USER:todo}
    password: ${DB_PASSWORD:todo}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

security:
  jwt:
    secret: very-secret-jwt-signing-key
  password:
    pepper: app-pepper-value
